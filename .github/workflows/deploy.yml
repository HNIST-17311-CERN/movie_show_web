name: Deploy to Ubuntu Server

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -Dmaven.test.skip=true

      - name: Package deploy files
        run: |
          mkdir -p deploy_package
          cp target/springboot-demo-1.0.0.jar deploy_package/
          cp -r src/main/resources/filmlane-master deploy_package/
          cp -r src/main/resources/adminkit-web-ui-kit-dashboard-template deploy_package/
          cp -r src/main/resources/live2d-example-master deploy_package/
          ls -la deploy_package/

      - name: Create SSH key file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.deploy"
          echo "-----BEGIN OPENSSH PRIVATE KEY-----" > "$GITHUB_WORKSPACE/.deploy/server_deploy_key"
          echo "${{ secrets.SERVER_SSH_KEY }}" | fold -w 70 >> "$GITHUB_WORKSPACE/.deploy/server_deploy_key"
          echo "-----END OPENSSH PRIVATE KEY-----" >> "$GITHUB_WORKSPACE/.deploy/server_deploy_key"
          chmod 600 "$GITHUB_WORKSPACE/.deploy/server_deploy_key"

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key_path: /github/workspace/.deploy/server_deploy_key
          port: ${{ secrets.SERVER_PORT }}
          source: "deploy_package"
          target: "~/incoming"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key_path: /github/workspace/.deploy/server_deploy_key
          port: ${{ secrets.SERVER_PORT }}
          script: |
            bash /opt/security/deploy.sh
