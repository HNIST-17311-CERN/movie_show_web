name: Deploy to Ubuntu Server

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -Dmaven.test.skip=true

      - name: Create SSH key file
        run: |
          mkdir -p ~/.ssh
          echo "-----BEGIN OPENSSH PRIVATE KEY-----" > ~/.ssh/server_deploy_key
          echo "${{ secrets.SERVER_SSH_KEY }}" | fold -w 70 >> ~/.ssh/server_deploy_key
          echo "-----END OPENSSH PRIVATE KEY-----" >> ~/.ssh/server_deploy_key
          chmod 600 ~/.ssh/server_deploy_key

      - name: Upload jar + frontend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key_path: ~/.ssh/server_deploy_key
          port: ${{ secrets.SERVER_PORT }}
          source: |
            target/springboot-demo-1.0.0.jar
            src/main/resources/filmlane-master
            src/main/resources/adminkit-web-ui-kit-dashboard-template
            src/main/resources/live2d-example-master
          target: "~/incoming"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key_path: ~/.ssh/server_deploy_key
          port: ${{ secrets.SERVER_PORT }}
          script: |
            bash /opt/security/deploy.sh
