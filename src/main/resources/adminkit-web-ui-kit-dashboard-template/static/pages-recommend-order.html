<script>
(function() {

var currentType = 'movie';
var items = [];
var DEFAULT_COVER = '../../filmlane-master/assets/images/movie-1.png';

function getToken() {
    return localStorage.getItem('token') || '';
}

function recApi(type) {
    return 'http://localhost:8080/home/' + type;
}

function getCoverUrl(cover) {
    if (!cover) return DEFAULT_COVER;
    if (/^https?:\/\//i.test(cover)) return cover;
    var n = String(cover).replace(/\\/g, '/');
    if (n.indexOf('assets/images/') !== -1) return '../../filmlane-master/' + n.substring(n.indexOf('assets/images/'));
    if (n.indexOf('resource/cover/') !== -1) return '../../filmlane-master/' + n.substring(n.indexOf('resource/cover/'));
    return n;
}

function loadItems() {
    fetch(recApi(currentType) + '/items', {
        headers: { token: getToken() }
    })
    .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
    })
    .then(function(data) {
        items = data || [];
        render();
    })
    .catch(function(err) { console.error('加载失败', err); });
}

function render() {
    var tbody = document.getElementById('orderTbody');
    var empty = document.getElementById('orderEmpty');

    if (!items.length) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';

    tbody.innerHTML = items.map(function(item, i) {
        var first = i === 0;
        var last = i === items.length - 1;
        return '<tr draggable="true" data-idx="' + i + '" ' +
            'ondragstart="onDragStart(event)" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">' +
            '<td><span class="order-badge">' + item.sortOrder + '</span></td>' +
            '<td><img class="cover-thumb" src="' + getCoverUrl(item.cover) + '" alt="" onerror="this.style.display=\'none\'"></td>' +
            '<td><a href="../../filmlane-master/movie-details.html?id=' + item.movieId + '" target="_blank">' + (item.movieName || '--') + '</a> <span class="text-muted">ID:' + item.movieId + '</span></td>' +
            '<td>' +
                '<button class="btn btn-sm btn-outline-secondary me-1" onclick="moveUp(' + i + ')"' + (first ? ' disabled' : '') + '>↑ 上移</button>' +
                '<button class="btn btn-sm btn-outline-secondary" onclick="moveDown(' + i + ')"' + (last ? ' disabled' : '') + '>↓ 下移</button>' +
            '</td>' +
            '</tr>';
    }).join('');
}

function moveUp(i) {
    if (i > 0) swapItems(i, i - 1);
}

function moveDown(i) {
    if (i < items.length - 1) swapItems(i, i + 1);
}

function swapItems(fromIdx, toIdx) {
    var a = items[fromIdx];
    var b = items[toIdx];
    var tmp = a.sortOrder;
    a.sortOrder = b.sortOrder;
    b.sortOrder = tmp;

    function post(item) {
        var url = recApi(currentType) + '/reorder?movieId=' + item.movieId + '&sortOrder=' + item.sortOrder;
        return fetch(url, { method: 'POST', headers: { token: getToken() } });
    }

    Promise.all([post(a), post(b)]).then(function() {
        items.sort(function(x, y) { return x.sortOrder - y.sortOrder; });
        render();
    });
}

// ========== 拖拽排序 ==========

var dragIdx = -1;

function onDragStart(e) {
    dragIdx = parseInt(e.target.closest('tr').getAttribute('data-idx'));
    e.target.closest('tr').classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
}

function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    var tr = e.target.closest('tr');
    if (tr) tr.classList.add('drag-over');
}

function onDragLeave(e) {
    var tr = e.target.closest('tr');
    if (tr) tr.classList.remove('drag-over');
}

function onDrop(e) {
    e.preventDefault();
    document.querySelectorAll('.order-table tbody tr').forEach(function(tr) { tr.classList.remove('dragging', 'drag-over'); });

    var toIdx = parseInt(e.target.closest('tr').getAttribute('data-idx'));
    if (dragIdx < 0 || toIdx < 0 || dragIdx === toIdx) return;

    var moved = items.splice(dragIdx, 1)[0];
    items.splice(toIdx, 0, moved);

    // 重新分配 sort_order: 0, 1, 2, ...
    items.forEach(function(item, i) { item.sortOrder = i; });

    var promises = items.map(function(item) {
        var url = recApi(currentType) + '/reorder?movieId=' + item.movieId + '&sortOrder=' + item.sortOrder;
        return fetch(url, { method: 'POST', headers: { token: getToken() } });
    });

    Promise.all(promises).then(function() { render(); });
    dragIdx = -1;
}

// Tab 切换
document.getElementById('typeTabs').addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    document.querySelectorAll('#typeTabs .nav-link').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentType = btn.getAttribute('data-type');
    items = [];
    loadItems();
});

window.moveUp = moveUp;
window.moveDown = moveDown;
window.onDragStart = onDragStart;
window.onDragOver = onDragOver;
window.onDragLeave = onDragLeave;
window.onDrop = onDrop;

// 初始化
loadItems();

})();
</script>
