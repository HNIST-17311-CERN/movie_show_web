<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Live2D</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
        }

        #live2d-widget {
            transform-origin: 100% 100% 0;
        }
    </style>
</head>

<body>

<!-- Live2D 看板娘核心库 -->
<script src="src/L2Dwidget.min.js"></script>

<!-- 初始化koharu看板娘模型：右下角显示、250x400尺寸、透明度1.0 -->
<script>

    L2Dwidget.init({

        model: {
            jsonPath:
                "packages/live2d-widget-model-koharu/assets/koharu.model.json"
        },

        display: {

            position: 'right',

            width: 250,
            height: 400,

            hOffset: 0,
            vOffset: -20
        },

        mobile: {
            show: true,
            scale: 0.5
        },

        react: {
            opacityDefault: 1,
            opacityOnHover: 1
        }

    });

</script>

</body>

</html>
