<script src="js/app.js"></script>
<script>
var username = localStorage.getItem('username') || '管理员';
document.getElementById('userDisplay').textContent = username;

fetch('http://localhost:8080/role/all')
  .then(function(r) { return r.json(); })
  .then(function(roles) {
    var container = document.getElementById('roleContainer');
    if (!roles.length) {
      container.innerHTML = '<div class="error">暂无角色数据</div>';
      return;
    }

    // MyBatis 级联查询行重复，需要去重合并
    var merged = mergeRoles(roles);
    container.innerHTML = merged.map(renderRole).join('');
  })
  .catch(function() {
    document.getElementById('roleContainer').innerHTML =
      '<div class="error">加载失败，请检查后端是否启动</div>';
  });

// MyBatis LEFT JOIN 会产生重复行，按 role_id 去重合并
function mergeRoles(rows) {
  var map = {};
  rows.forEach(function(row) {
    var id = row.id;
    if (!map[id]) {
      map[id] = {
        id: id,
        name: row.name,
        description: row.description,
        permissions: [],
        users: [],
        permIds: new Set(),
        userIds: new Set()
      };
    }
    var r = map[id];
    // 去重权限
    (row.permissions || []).forEach(function(p) {
      if (p && !r.permIds.has(p.id)) {
        r.permIds.add(p.id);
        r.permissions.push(p);
      }
    });
    // 去重用户
    (row.users || []).forEach(function(u) {
      if (u && !r.userIds.has(u.id)) {
        r.userIds.add(u.id);
        r.users.push(u);
      }
    });
  });
  return Object.values(map);
}

function renderRole(role) {
  var permHtml = role.permissions.length
    ? role.permissions.map(function(p) { return '<span class="badge-perm">' + p.name + '</span>'; }).join('')
    : '<span class="empty-row">无权限</span>';

  var userHtml = role.users.length
    ? role.users.map(function(u) { return '<span class="badge-user">' + (u.username || u.id) + '</span>'; }).join('')
    : '<span class="empty-row">无用户</span>';

  return '<div class="role-card">' +
    '<div class="role-card-header">' +
      '<h5>' + (role.name || '--') + '</h5>' +
      '<small>' + (role.description || '') + '</small>' +
    '</div>' +
    '<div class="role-card-body">' +
      '<h6>权限 (' + role.permissions.length + ')</h6>' +
      '<div class="badge-list">' + permHtml + '</div>' +
      '<h6>用户 (' + role.users.length + ')</h6>' +
      '<div class="badge-list">' + userHtml + '</div>' +
    '</div>' +
  '</div>';
}
</script>
