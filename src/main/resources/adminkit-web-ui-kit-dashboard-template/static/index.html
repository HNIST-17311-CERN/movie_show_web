<script>
(function() {
  var token = localStorage.getItem('token') || '';


  fetch('http://localhost:8080/api/messages', { headers: { token: token } })
  .then(function(res) { return res.json(); })
  .then(function(msgs) {
    var tbody = document.getElementById('recentMsgTable');
    if (!msgs || !msgs.length) { if(tbody) tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">暂无留言</td></tr>'; return; }
    if (tbody) tbody.innerHTML = msgs.slice(0, 8).map(function(m) {
      var time = m.createTime ? String(m.createTime).substring(0, 16).replace('T', ' ') : '';
      var badge = '<span class="badge bg-' + (m.type === '报错' ? 'danger' : m.type === '建议' ? 'primary' : 'warning') + '">' + (m.type || '反馈') + '</span>';
      var c = (m.content || '').substring(0, 60) + ((m.content || '').length > 60 ? '...' : '');
      return '<tr><td>' + (m.username || '--') + '</td><td>' + badge + '</td><td>' + c + '</td><td>' + time + '</td></tr>';
    }).join('');
  });

  fetch('http://localhost:8080/api/stats/movies-monthly', { headers: { token: token } })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    var months = Object.keys(data), counts = Object.values(data);
    var canvas = document.getElementById('chart-movement');
    if (canvas) new Chart(canvas, {
      type: 'line',
      data: { labels: months, datasets: [{ data: counts, borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.1)', fill: true, tension: 0.3, pointRadius: 3 }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 500, ticks: { stepSize: 50 } } }, plugins: { legend: { display: false } } }
    });
  });

  fetch('http://localhost:8080/api/logs/recent?limit=30', { headers: { token: token } })
  .then(function(res) { return res.json(); })
  .then(function(logs) {
    var tbody = document.getElementById('logTable');
    if (tbody) tbody = tbody.querySelector('tbody');
    if (!logs || !logs.length) { if(tbody) tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">暂无记录</td></tr>'; return; }
    if (tbody) tbody.innerHTML = logs.map(function(l) {
      var time = l.createTime ? String(l.createTime).substring(0, 19).replace('T', ' ') : '';
      var badge = l.result === 'SUCCESS' ? '<span class="badge bg-success">成功</span>' : '<span class="badge bg-danger">失败</span>';
      return '<tr><td>' + (l.username || '') + '</td><td>' + (l.operation || '') + '</td><td style="font-size:12px;">' + (l.method || '') + '</td><td>' + badge + '</td><td>' + (l.executeTime || 0) + 'ms</td><td>' + time + '</td></tr>';
    }).join('');
  });
})();
</script>
