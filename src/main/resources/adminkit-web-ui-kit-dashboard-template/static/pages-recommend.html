        <main class="content">
            <div class="container-fluid p-0">
                <h1 class="h3 mb-3"><strong>首页推荐</strong> 管理</h1>

                <ul class="nav nav-tabs mb-3" id="recTabs">
                    <li class="nav-item">
                        <button class="nav-link active" data-type="movie">电影推荐</button>
                    </li>

                <div class="card">

                            <span class="fw-bold">添加推荐：</span>
                            <input type="number" id="addMovieId" class="form-control w-auto" placeholder="影片ID" style="width:140px;">
                            <input type="number" id="addSortOrder" class="form-control w-auto" placeholder="排序" style="width:100px;" value="0">
                            <button class="btn btn-primary" onclick="addRecommend()">添加</button>
                        </div>

                        <table class="table rec-table">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>封面</th>
                                <th>名称</th>
                                <th>排序</th>
                                <th>添加时间</th>
                                <th>操作</th>
                            </tr>
                            </thead>
                            <tbody id="recTbody"></tbody>
                        </table>
                        <div id="recEmpty" class="text-center text-muted py-4" style="display:none;">暂无推荐数据</div>
                    </div>
                </div>
            </div>

<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
var currentType = 'movie';

function getToken() {
    return localStorage.getItem('token') || '';
}

function apiBase(type) {
    return 'http://localhost:8080/home/' + type;
}

// ==================== 加载列表 ====================

function loadList() {
    var tbody = document.getElementById('recTbody');
    var empty = document.getElementById('recEmpty');

    fetch(apiBase(currentType) + '/items', {
        headers: { token: getToken() }
    })
    .then(function(res) {
        if (res.status === 401) {
            localStorage.removeItem('token');
            tbody.innerHTML = '';
            empty.style.display = 'block';
            empty.innerHTML = '登录已过期，请重新 <a href="pages-sign-in.html">登录</a>';
            return;
        }
        return res.json();
    })
    .then(function(items) {
        if (!items || !items.length) {
            tbody.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';
        tbody.innerHTML = items.map(function(item) {
            return '<tr>' +
                '<td>' + item.movieId + '</td>' +
                '<td><img class="rec-cover-thumb" src="' + (item.cover || '') + '" alt="" onerror="this.style.display=\'none\'"></td>' +
                '<td>' + (item.movieName || '--') + '</td>' +
                '<td><span class="sort-order-badge" id="sort-' + item.movieId + '">' + item.sortOrder + '</span>' +
                    '<button class="btn btn-sm btn-outline-secondary ms-2" onclick="editSort(' + item.movieId + ', ' + item.sortOrder + ')">改</button></td>' +
                '<td>' + (item.createTime || '') + '</td>' +
                '<td><button class="btn btn-sm btn-danger" onclick="deleteItem(' + item.movieId + ')">删除</button></td>' +
                '</tr>';
        }).join('');
    })
    .catch(function(err) {
        console.error('加载列表失败', err);
        tbody.innerHTML = '';
        empty.style.display = 'block';
        empty.textContent = '加载失败，请检查后端服务';
    });
}

// ==================== 添加 ====================

function addRecommend() {
    var movieId = document.getElementById('addMovieId').value.trim();
    var sortOrder = document.getElementById('addSortOrder').value.trim() || '0';
    if (!movieId) { alert('请输入影片ID'); return; }

    var formData = new URLSearchParams();
    formData.append('movieId', movieId);
    formData.append('sortOrder', sortOrder);

    fetch(apiBase(currentType) + '/add', {
        method: 'POST',
        headers: { token: getToken(), 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
    })
    .then(function(res) { return res.text(); })
    .then(function(msg) {
        alert(msg);
        document.getElementById('addMovieId').value = '';
        document.getElementById('addSortOrder').value = '0';
        loadList();
    })
    .catch(function() { alert('请求失败，请检查后端'); });
}

// ==================== 删除 ====================

function deleteItem(movieId) {
    if (!confirm('确定要删除 ID=' + movieId + ' 的推荐吗？')) return;

    var formData = new URLSearchParams();
    formData.append('movieId', movieId);

    fetch(apiBase(currentType) + '/delete', {
        method: 'POST',
        headers: { token: getToken(), 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
    })
    .then(function(res) { return res.text(); })
    .then(function(msg) { alert(msg); loadList(); })
    .catch(function() { alert('请求失败，请检查后端'); });
}

// ==================== 改排序 ====================

function editSort(movieId, oldVal) {
    var newVal = prompt('输入新的排序值（当前：' + oldVal + '）', oldVal);
    if (newVal === null || newVal.trim() === '') return;

    var formData = new URLSearchParams();
    formData.append('movieId', movieId);
    formData.append('sortOrder', newVal.trim());

    fetch(apiBase(currentType) + '/reorder', {
        method: 'POST',
        headers: { token: getToken(), 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
    })
    .then(function(res) { return res.text(); })
    .then(function(msg) { alert(msg); loadList(); })
    .catch(function() { alert('请求失败，请检查后端'); });
}

// ==================== Tab 切换 ====================

document.getElementById('recTabs').addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn) return;

    document.querySelectorAll('#recTabs .nav-link').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentType = btn.getAttribute('data-type');
    loadList();
});

// ==================== 初始化 ====================

loadList();
</script>
