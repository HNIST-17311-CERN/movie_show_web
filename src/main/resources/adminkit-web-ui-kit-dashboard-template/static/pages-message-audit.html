<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function() {

function getToken() { return localStorage.getItem('token') || ''; }

function loadPending() {
    fetch('http://localhost:8080/api/messages/pending', {
        headers: { token: getToken() }
    })
    .then(function(res) { return res.json(); })
    .then(function(messages) {
        var tbody = document.getElementById('msgTbody');
        var empty = document.getElementById('msgEmpty');
        if (!messages || !messages.length) {
            tbody.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';
        tbody.innerHTML = messages.map(function(m) {
            var time = m.createTime ? String(m.createTime).substring(0, 16) : '';
            return '<tr>' +
                '<td>' + m.id + '</td>' +
                '<td>' + (m.username || '--') + '</td>' +
                '<td><span class="msg-type-badge msg-type-' + (m.type || '反馈') + '">' + (m.type || '反馈') + '</span></td>' +
                '<td><div class="msg-content">' + (m.content || '') + '</div></td>' +
                '<td>' + time + '</td>' +
                '<td>' +
                    '<button class="btn btn-sm btn-success me-1" onclick="approve(' + m.id + ')">通过</button>' +
                    '<button class="btn btn-sm btn-outline-danger" onclick="reject(' + m.id + ')">拒绝</button>' +
                '</td>' +
                '</tr>';
        }).join('');
    });
}

function approve(id) {
    if (!confirm('确定通过这条留言吗？')) return;
    var fd = new URLSearchParams();
    fd.append('id', id);
    fetch('http://localhost:8080/api/messages/approve', {
        method: 'POST',
        headers: { token: getToken(), 'Content-Type': 'application/x-www-form-urlencoded' },
        body: fd.toString()
    })
    .then(function(res) { return res.text(); })
    .then(function(msg) { alert(msg); loadPending(); });
}

function reject(id) {
    if (!confirm('确定拒绝这条留言吗？')) return;
    var fd = new URLSearchParams();
    fd.append('id', id);
    fetch('http://localhost:8080/api/messages/reject', {
        method: 'POST',
        headers: { token: getToken(), 'Content-Type': 'application/x-www-form-urlencoded' },
        body: fd.toString()
    })
    .then(function(res) { return res.text(); })
    .then(function(msg) { alert(msg); loadPending(); });
}

window.approve = approve;
window.reject = reject;

loadPending();

})();
</script>
