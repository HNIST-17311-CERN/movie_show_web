<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言板 — 电影俱乐部 Movie Club</title>
  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    .msg-input {
      width: 100%; min-height: 120px; padding: 14px 16px;
      border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 15px; line-height: 1.8; color: #1f2937;
      resize: vertical; outline: none; font-family: inherit;
      box-sizing: border-box;
    }
    .msg-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .msg-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    .msg-type-select { padding: 8px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; background: #fff; }
    .msg-type-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-right: 8px; }
    .msg-type-反馈 { background: #fef3c7; color: #d97706; }
    .msg-type-建议 { background: #dbeafe; color: #2563eb; }
    .msg-type-报错 { background: #fecaca; color: #dc2626; }
    .msg-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
    .msg-actions button {
      padding: 10px 32px; background: var(--primary, #007bff);
      color: #fff; border: none; border-radius: 6px;
      font-size: 15px; cursor: pointer; transition: opacity 0.15s;
    }
    .msg-actions button:hover { opacity: 0.85; }
    .message-list { margin-top: 32px; }
    .message-empty { text-align: center; padding: 48px 20px; color: #bbb; font-size: 14px; }
    .user-menu { position: relative; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary, #007bff); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; user-select: none; }
    .user-dropdown { position: absolute; top: 44px; right: 0; width: 180px; background: #fff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 1000; overflow: hidden; }
    .user-info { padding: 14px 16px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; text-align: center; }
    .user-dropdown-menu { list-style: none; margin: 0; padding: 4px 0; }
    .user-dropdown-menu li a { display: block; padding: 10px 16px; font-size: 13px; color: #333; text-decoration: none; transition: background 0.2s; }
    .user-dropdown-menu li a:hover { background: #f5f5f5; color: #e74c3c; }
  </style>
</head>
<body id="top">

<header class="header">
  <div class="header-inner">
    <a href="./index.html" class="logo"><span class="logo-cn">电影俱乐部</span> <span class="logo-en">Movie Club</span></a>
    <nav class="nav-links">
      <a href="./index.html">首页</a>
      <a href="./All_movie.html">电影</a>
      <a href="./TV_series.html">剧集</a>
      <a href="./Net_movie.html">动漫</a>
      <a href="./Online.html">在线</a>
      <a href="./JieSuo.html">解析</a>
      <a href="./Setting.html">设置</a>
    </nav>
    <div class="search-box">
      <input type="text" placeholder="搜索影片">
    </div>
    <div class="header-actions">
      <a href="./notifications.html">通知</a>
      <a href="./messages.html">留言</a>
      <a href="#">观看历史</a>
      <div class="user-menu" id="userMenu">
        <div class="user-avatar" onclick="toggleUserDropdown()">
          <span id="avatarText">用</span>
        </div>
        <div class="user-dropdown" id="userDropdown" style="display:none;">
          <div class="user-info"><b id="displayUsername">--</b></div>
          <ul class="user-dropdown-menu">
            <li><a href="../adminkit-web-ui-kit-dashboard-template/static/pages-blank.html">后台管理</a></li>
            <li><a href="#" onclick="doLogout()">退出登录</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="container">
    <section class="section">
      <h2 class="section-title">留言板</h2>
      <div class="msg-toolbar">
        <select class="msg-type-select" id="msgType">
          <option value="反馈">问题反馈</option>
          <option value="建议">功能建议</option>
          <option value="报错">资源报错</option>
        </select>
      </div>
      <textarea class="msg-input" id="msgInput" placeholder="写下你想说的话..."></textarea>
      <div class="msg-actions">
        <button onclick="submitMessage()">发布留言</button>
      </div>

      <div class="message-list">
        <h2 class="section-title">全部留言</h2>
        <div class="message-empty" id="messageList">暂无留言，来抢个沙发吧</div>
      </div>
    </section>
  </div>
</main>

<a href="#top" class="go-top" data-go-top>↑</a>

<script src="./assets/js/script.js"></script>
<script>
var token = localStorage.getItem('token');
if (!token) {
  window.location.href = '../adminkit-web-ui-kit-dashboard-template/static/pages-sign-in.html';
}

/* ==================== 用户菜单 ==================== */

(function initUserMenu() {
  var username = localStorage.getItem('username') || '用户';
  document.getElementById('avatarText').textContent = username.charAt(0).toUpperCase();
  document.getElementById('displayUsername').textContent = username;
})();

function toggleUserDropdown() {
  var d = document.getElementById('userDropdown');
  d.style.display = d.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', function(e) {
  var m = document.getElementById('userMenu');
  if (m && !m.contains(e.target)) document.getElementById('userDropdown').style.display = 'none';
});
function doLogout() {
  localStorage.removeItem('token'); localStorage.removeItem('username');
  window.location.href = '../adminkit-web-ui-kit-dashboard-template/static/pages-sign-in.html';
}

/* ==================== 加载留言 ==================== */

function loadMessages() {
  fetch('http://localhost:8080/api/messages', {
    headers: { token: token }
  })
  .then(function(res) { return res.json(); })
  .then(function(messages) {
    var list = document.getElementById('messageList');
    if (!messages || !messages.length) return;
    list.classList.remove('message-empty');
    list.innerHTML = '';
    messages.forEach(function(msg) {
      var time = msg.createTime ? String(msg.createTime).substring(0, 16).replace('T', ' ') : '';
      var card = document.createElement('div');
      card.style.cssText = 'border-bottom:1px solid #e5e7eb;padding:20px 0;';
      card.innerHTML =
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">' +
          '<div style="width:36px;height:36px;border-radius:50%;background:#007bff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;">' + (msg.username || '?').charAt(0).toUpperCase() + '</div>' +
          '<div><b style="font-size:15px;">' + (msg.username || '匿名') + '</b>' +
            '<span class="msg-type-tag msg-type-' + (msg.type || '反馈') + '">' + (msg.type || '反馈') + '</span>' +
            '<br><span style="font-size:12px;color:#999;">' + time + '</span></div>' +
        '</div>' +
        '<div style="font-size:14px;line-height:1.8;color:#333;white-space:pre-wrap;">' + (msg.content || '') + '</div>';
      list.appendChild(card);
    });
  });
}

/* ==================== 提交留言 ==================== */

function submitMessage() {
  var content = document.getElementById('msgInput').value.trim();
  if (!content) { alert('请输入留言内容'); return; }
  var username = localStorage.getItem('username') || '匿名用户';
  var type = document.getElementById('msgType').value;

  fetch('http://localhost:8080/api/messages/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', token: token },
    body: JSON.stringify({ username: username, content: content, type: type })
  })
  .then(function(res) { return res.text(); })
  .then(function(msg) {
    alert(msg);
    document.getElementById('msgInput').value = '';
  })
  .catch(function() { alert('提交失败'); });
}

loadMessages();
</script>
</body>
</html>
