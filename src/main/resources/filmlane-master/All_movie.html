  <style>
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .pagination-btn,
    .pagination-input,
    .pagination-jump {
      height: 42px;
      border: 1px solid #e5e7eb;
      background: #fff;
      color: #374151;
      font-size: 16px;
    }

    .pagination-btn {
      min-width: 40px;
      padding: 0 14px;
      margin-left: -1px;
      cursor: pointer;
    }

    .pagination-btn.active {
      background: #60a5fa;
      color: #fff;
      border-color: #60a5fa;
    }

    .pagination-btn:disabled {
      color: #9ca3af;
      background: #f9fafb;
      cursor: not-allowed;
    }

    .pagination-ellipsis {
      height: 42px;
      line-height: 42px;
      padding: 0 14px;
      border: 1px solid #e5e7eb;
      margin-left: -1px;
      background: #fff;
      color: #6b7280;
    }

    .pagination-input {
      width: 86px;
      margin-left: 12px;
      padding: 0 10px;
      outline: none;
    }

    .pagination-jump {
      padding: 0 14px;
      margin-left: -1px;
      cursor: pointer;
    }

    .pagination-jump:hover,
    .pagination-btn:not(:disabled):hover {
      background: #f3f4f6;
    }

    .filter-section {
      padding: 8px 0 14px;
      border: 0;
      box-shadow: none;
    }

    .filter-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 7px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .filter-label {
      flex: 0 0 42px;
      line-height: 24px;
      font-size: 14px;
      color: #111827;
      white-space: nowrap;
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      line-height: 24px;
    }

    .filter-pill {
      padding: 0;
      border: 0;
      background: transparent;
      color: #111827;
      line-height: 24px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-pill.active {
      padding: 0 4px;
      border-radius: 4px;
      background: #2f80ff;
      color: #fff;
    }

    .filter-toolbar {
      padding-top: 10px;
      gap: 14px;
      font-size: 14px;
    }

    .filter-toolbar select {
      height: 28px;
      padding: 2px 26px 2px 8px;
      font-size: 13px;
    }

    .filter-checkbox { line-height: 28px; }
    .user-menu { position: relative; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary, #007bff); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; user-select: none; }
    .user-dropdown { position: absolute; top: 44px; right: 0; width: 180px; background: #fff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 1000; overflow: hidden; }
    .user-info { padding: 14px 16px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; text-align: center; }
    .user-dropdown-menu { list-style: none; margin: 0; padding: 4px 0; }
    .user-dropdown-menu li a { display: block; padding: 10px 16px; font-size: 13px; color: #333; text-decoration: none; transition: background 0.2s; }
    .user-dropdown-menu li a:hover { background: #f5f5f5; color: #e74c3c; }
  </style>
</head>

<script src="./assets/js/script.js"></script>
<!--
电影列表页（分页+筛选+排序）
  页面级变量:
    movies[] (实际未缓存全量，仅currentPage数据通过DOM体现)
    currentPage, hasNextPage, PAGE_SIZE=60
    filters { type, year, region, language, sort }
    pendingScores[] — 评分异步加载后暂存，全部到齐后按分排序

  筛选联动: pill点击 → filters[key]更新 → loadMovies(1) → buildMoviesUrl()决定调哪个API
  排序联动: 下拉change → getSortValue() 标记scoreSortActive → 评分全部到齐后reorderByScore()
  分页: renderPagination() 创建上一页/页码/下一页/跳转输入按钮
-->
<script>
  (function() {
    var API_URL = 'http://localhost:8080/FILMES/ONEP';
    var FILTER_API_URL = 'http://localhost:8080/FILMES/FILTER';
    var LOGIN_URL = '../adminkit-web-ui-kit-dashboard-template/static/pages-sign-in.html';
    var DEFAULT_COVER_URL = './assets/images/movie-1.png';
    var PAGE_SIZE = 60;
    var currentPage = 1;
    var hasNextPage = true;
    var filters = {
      type: '全部',
      year: '全部',
      region: '全部',
      language: '全部',
      sort: ''
    };

    // 将封面路径规范化：本地相对路径/远程URL/默认封面兜底
    function getCoverUrl(cover) {
      if (!cover) return DEFAULT_COVER_URL;
      if (/^https?:\/\//i.test(cover)) return cover;
      var normalized = String(cover).replace(/\\/g, '/');
      if (normalized.indexOf('assets/images/') !== -1) return './' + normalized.substring(normalized.indexOf('assets/images/'));
      if (normalized.indexOf('resource/cover/') !== -1) return './' + normalized.substring(normalized.indexOf('resource/cover/'));
      if (normalized.startsWith('/')) return '.' + normalized;
      return normalized;
    }

    // 设置图片元素的src并注册加载失败兜底
    function setLocalImage(imgEl, cover) {
      imgEl.src = getCoverUrl(cover);
      imgEl.onerror = function() {
        this.onerror = null;
        this.src = DEFAULT_COVER_URL;
      };
    }

    // 判断筛选器是否为"全部"（即未选中特定筛选项）
    function isAll(value) {
      return !value || value === '全部';
    }

    // 判断是否有任何激活的筛选条件
    function hasActiveFilters() {
      return !isAll(filters.type) ||
        !isAll(filters.year) ||
        !isAll(filters.region) ||
        !isAll(filters.language) ||
        !!filters.sort;
    }

    // 将筛选栏中文标签映射为API参数字段名
    function getFilterKey(label) {
      if (label === '类型') return 'type';
      if (label === '年代') return 'year';
      if (label === '地区') return 'region';
      if (label === '语言') return 'language';
      return '';
    }

    var pendingScores = [];
    var scoreSortActive = false;

    // 将排序选项文本映射为API sort参数，标记是否按评分排序
    function getSortValue(text) {
      if (text === '添加时间' || text === '更新时间') { scoreSortActive = false; return 'create_time'; }
      if (text === '上映时间') { scoreSortActive = false; return 'releaseDate'; }
      if (text === '评分最高') { scoreSortActive = true; return 'create_time'; }
      if (text === '评分人数' || text === '评分总人数' || text === '综合评分') { scoreSortActive = true; return 'create_time'; }
      scoreSortActive = false;
      return '';
    }

    // 构建API请求URL：有筛选条件用/FILMES/FILTER否则用/FILMES/ONEP
    function buildMoviesUrl(page) {
      var params = new URLSearchParams();
      params.set('page', page);
      params.set('pageSize', PAGE_SIZE);

      if (!isAll(filters.type)) params.set('type', filters.type);
      if (!isAll(filters.year)) params.set('year', filters.year);
      if (!isAll(filters.region)) params.set('region', filters.region);
      if (!isAll(filters.language)) params.set('language', filters.language);
      if (filters.sort) params.set('sort', filters.sort);

      return (hasActiveFilters() ? FILTER_API_URL : API_URL) + '?' + params.toString();
    }

    // 绑定筛选器点击事件：类型/年代/地区/语言pill切换、排序下拉
    function bindFilters() {
      document.querySelectorAll('.filter-row').forEach(function(row) {
        var labelEl = row.querySelector('.filter-label');
        var key = labelEl ? getFilterKey(labelEl.textContent.trim()) : '';
        if (!key) return;

        row.querySelectorAll('.filter-pill').forEach(function(btn) {
          btn.addEventListener('click', function() {
            row.querySelectorAll('.filter-pill').forEach(function(item) {
              item.classList.remove('active');
            });
            btn.classList.add('active');
            filters[key] = btn.textContent.trim();
            loadMovies(1);
          });
        });
      });

      var sortSelect = document.querySelector('.filter-toolbar select');
      if (sortSelect) {
        sortSelect.addEventListener('change', function() {
          filters.sort = getSortValue(sortSelect.options[sortSelect.selectedIndex].textContent.trim());
          loadMovies(1);
        });
      }
    }

    // 提示用户需要登录，隐藏加载状态和分页栏
    function needLogin() {
      var loadingEl = document.getElementById('loading');
      var listEl = document.getElementById('movies-list');
      var bar = document.getElementById('pagination-bar');
      loadingEl.style.display = 'none';
      bar.style.display = 'none';
      listEl.innerHTML = '<li class="empty-state">请先 <a href="' + LOGIN_URL + '">登录</a> 后访问</li>';
    }

    // 渲染单个电影卡片 + 异步查评分
    // 入参: movie { id, name, cover, releaseDate, region, type, duration }
    // 创建: li.movie-card-wrapper > .movie-card > a[href=movie-details.html?id=] > figure.card-banner + h3.card-title + p.card-meta
    // 异步: GET /FILMES/SCORE/ONE?id= → 回填.card-score + 存入pendingScores[]
    //       如果scoreSortActive且所有卡片评分到齐 → reorderByScore()
    function renderMovie(movie) {
      var meta = [movie.releaseDate ? String(movie.releaseDate).substring(0, 4) : '', movie.region || '', movie.type || ''].filter(Boolean).join(' / ');
      var li = document.createElement('li');
      li.className = 'movie-card-wrapper';
      li.innerHTML =
        '<div class="movie-card">' +
        '<a href="./movie-details.html?id=' + movie.id + '" target="_blank" rel="noopener noreferrer">' +
        '<figure class="card-banner">' +
        '<img alt="' + (movie.name || '').replace(/"/g, '&quot;') + '">' +
        '<span class="card-badge">HD</span>' +
        '<div class="card-overlay">' +
        '<span class="star-count">★ ' + (movie.duration ? movie.duration + 'min' : '--') + '</span>' +
        '<span class="rating">--</span>' +
        '</div>' +
        '</figure>' +
        '</a>' +
        '<h3 class="card-title">' + (movie.name || '未知').replace(/</g, '&lt;') + '<span class="card-score"></span></h3>' +
        '<p class="card-meta">' + (meta || '--') + '</p>' +
        '</div>';

      document.getElementById('movies-list').appendChild(li);
      var coverImg = li.querySelector('.card-banner img');
      if (coverImg) setLocalImage(coverImg, movie.cover);

      fetch('http://localhost:8080/FILMES/SCORE/ONE?id=' + movie.id, {
        headers: { token: localStorage.getItem('token') || '' }
      })
        .then(function(res) { return res.json(); })
        .then(function(scores) {
          var score = Array.isArray(scores) && scores.length ? scores[0] : null;
          if (score) {
            var scoreEl = li.querySelector('.card-score');
            var scoreValue = Number(score.score) || 0;
            if (scoreEl) scoreEl.textContent = scoreValue.toFixed(1);
            pendingScores.push({ li: li, score: scoreValue });
            var cards = document.querySelectorAll('#movies-list .movie-card-wrapper');
            if (scoreSortActive && pendingScores.length === cards.length) {
              reorderByScore();
            }
          }
        })
        .catch(function() {});
    }

    // 按评分降序重排卡片DOM顺序
    function reorderByScore() {
      pendingScores.sort(function(a, b) { return b.score - a.score; });
      var listEl = document.getElementById('movies-list');
      pendingScores.forEach(function(item) {
        listEl.appendChild(item.li);
      });
    }

    // 创建分页按钮DOM元素
    function createPageBtn(label, page, active) {
      var btn = document.createElement('button');
      btn.className = 'pagination-btn' + (active ? ' active' : '');
      btn.textContent = label;
      btn.addEventListener('click', function() {
        loadMovies(page);
      });
      return btn;
    }

    // 渲染分页栏：上一页/页码/下一页/跳转输入
    function renderPagination() {
      var bar = document.getElementById('pagination-bar');
      var startPage = Math.floor((currentPage - 1) / 10) * 10 + 1;
      var endPage = startPage + 9;

      bar.innerHTML = '';
      bar.style.display = 'flex';

      var prevBtn = document.createElement('button');
      prevBtn.className = 'pagination-btn';
      prevBtn.textContent = '上一页';
      prevBtn.disabled = currentPage <= 1;
      prevBtn.addEventListener('click', function() {
        if (currentPage > 1) loadMovies(currentPage - 1);
      });
      bar.appendChild(prevBtn);

      for (var page = startPage; page <= endPage; page++) {
        bar.appendChild(createPageBtn(String(page), page, page === currentPage));
      }

      if (hasNextPage) {
        var ellipsis = document.createElement('span');
        ellipsis.className = 'pagination-ellipsis';
        ellipsis.textContent = '...';
        bar.appendChild(ellipsis);
      }

      var nextBtn = document.createElement('button');
      nextBtn.className = 'pagination-btn';
      nextBtn.textContent = '下一页';
      nextBtn.disabled = !hasNextPage;
      nextBtn.addEventListener('click', function() {
        if (hasNextPage) loadMovies(currentPage + 1);
      });
      bar.appendChild(nextBtn);

      var input = document.createElement('input');
      input.className = 'pagination-input';
      input.type = 'number';
      input.min = '1';
      input.placeholder = '输入页码';
      bar.appendChild(input);

      var jumpBtn = document.createElement('button');
      jumpBtn.className = 'pagination-jump';
      jumpBtn.textContent = '跳转';
      jumpBtn.addEventListener('click', function() {
        var page = parseInt(input.value, 10);
        if (!page || page < 1) return;
        loadMovies(page);
      });
      bar.appendChild(jumpBtn);
    }

    // 核心加载函数
    // 1. 检查token → 无则needLogin()
    // 2. fetch(buildMoviesUrl(page)) → 响应可能是JSON数组或{data:[...]}
    // 3. 更新currentPage/hasNextPage → 清空列表 → 遍历renderMovie()
    // 4. HTTP 401 → 清除token + needLogin()
    function loadMovies(page) {
      var token = localStorage.getItem('token');
      var listEl = document.getElementById('movies-list');
      var loadingEl = document.getElementById('loading');
      var errorEl = document.getElementById('error');
      var bar = document.getElementById('pagination-bar');

      if (!token) {
        needLogin();
        return;
      }

      currentPage = page;
      loadingEl.style.display = 'block';
      errorEl.style.display = 'none';
      listEl.innerHTML = '';
      bar.style.display = 'none';

      fetch(buildMoviesUrl(page), {
        headers: {
          token: token,
          'Content-Type': 'application/json'
        }
      })
        .then(function(res) {
          if (res.status === 401) {
            localStorage.removeItem('token');
            needLogin();
            throw new Error('Unauthorized');
          }
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function(json) {
          var movies = json;
          if (json && typeof json.data !== 'undefined') movies = json.data;
          if (!Array.isArray(movies)) movies = [];

          loadingEl.style.display = 'none';
          errorEl.style.display = 'none';
          listEl.innerHTML = '';
          hasNextPage = movies.length === PAGE_SIZE;

          if (movies.length > 0) {
            pendingScores = [];
            movies.forEach(renderMovie);
          } else {
            listEl.innerHTML = '<li class="empty-state">暂无电影</li>';
            hasNextPage = false;
          }

          renderPagination();
        })
        .catch(function(err) {
          if (err.message === 'Unauthorized') return;
          loadingEl.style.display = 'none';
          errorEl.style.display = 'block';
          bar.style.display = 'none';
        });
    }

    bindFilters();
    loadMovies(1);
  })();
</script>

<!-- 用户菜单：初始化头像下拉菜单、切换显示/隐藏、退出登录 -->
<script>
  (function initUserMenu() {
    var username = localStorage.getItem('username') || '用户';
    document.getElementById('avatarText').textContent = username.charAt(0).toUpperCase();
    document.getElementById('displayUsername').textContent = username;
  })();
  // 切换用户下拉菜单的显示/隐藏
  function toggleUserDropdown() {
    var d = document.getElementById('userDropdown');
    d.style.display = d.style.display === 'none' ? 'block' : 'none';
  }
  document.addEventListener('click', function(e) {
    var m = document.getElementById('userMenu');
    if (m && !m.contains(e.target)) document.getElementById('userDropdown').style.display = 'none';
  });
  // 退出登录：清除token和username，跳转到登录页
  function doLogout() {
    localStorage.removeItem('token'); localStorage.removeItem('username');
    window.location.href = '../adminkit-web-ui-kit-dashboard-template/static/pages-sign-in.html';
  }
</script>
