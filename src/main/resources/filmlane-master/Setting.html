<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - 电影俱乐部 Movie Club</title>
  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    .user-menu { position: relative; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary, #007bff); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; user-select: none; }
    .user-dropdown { position: absolute; top: 44px; right: 0; width: 180px; background: #fff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 1000; overflow: hidden; }
    .user-info { padding: 14px 16px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; text-align: center; }
    .user-dropdown-menu { list-style: none; margin: 0; padding: 4px 0; }
    .user-dropdown-menu li a { display: block; padding: 10px 16px; font-size: 13px; color: #333; text-decoration: none; transition: background 0.2s; }
    .user-dropdown-menu li a:hover { background: #f5f5f5; color: #e74c3c; }
  </style>
</head>
<body id="top">

  <header class="header">
    <div class="header-inner">
      <a href="./index.html" class="logo"><span class="logo-cn">电影俱乐部</span> <span class="logo-en">Movie Club</span></a>
      <nav class="nav-links">
        <a href="./index.html">首页</a>
        <a href="./All_movie.html">电影</a>
        <a href="./TV_series.html">剧集</a>
        <a href="./Net_movie.html">动漫</a>
        <a href="./Online.html">在线</a>
        <a href="./JieSuo.html">解析</a>
        <a href="./Setting.html" class="active">设置</a>
      </nav>
      <div class="search-box">
        <input type="text" placeholder="搜索影片">
      </div>
      <div class="header-actions">
        <a href="./notifications.html">通知</a>
        <a href="./messages.html">留言</a>
        <div class="user-menu" id="userMenu">
          <div class="user-avatar" onclick="toggleUserDropdown()">
            <span id="avatarText">用</span>
          </div>
          <div class="user-dropdown" id="userDropdown" style="display:none;">
            <div class="user-info"><b id="displayUsername">--</b></div>
            <ul class="user-dropdown-menu">
              <li><a href="../adminkit-web-ui-kit-dashboard-template/static/pages-blank.html">后台管理</a></li>
              <li><a href="#" onclick="doLogout()">退出登录</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="section">
        <h2 class="section-title">设置</h2>
        <div class="detail-section">
          <p class="intro-text" style="margin-bottom: 20px;">这里是设置页面，后续可以接入用户偏好、主题切换、账号管理等功能。</p>

          <h3 style="font-size:15px; font-weight:600; margin-bottom:14px; color: var(--text);">外观</h3>
          <div class="plugin-toggle">
            <div class="plugin-toggle-left">
              <span class="plugin-toggle-label">深色模式</span>
              <span class="plugin-toggle-desc">切换深色/浅色主题外观</span>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="toggleDarkMode">
              <span class="toggle-slider"></span>
            </label>
          </div>

          <h3 style="font-size:15px; font-weight:600; margin: 24px 0 14px; color: var(--text);">插件</h3>
          <div class="plugin-toggle">
            <div class="plugin-toggle-left">
              <span class="plugin-toggle-label">相似电影推荐</span>
              <span class="plugin-toggle-desc">在电影详情页展示相关电影推荐</span>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="toggleSimilarMovies" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      </section>
    </div>
  </main>

  <a href="#top" class="go-top" data-go-top>↑</a>
  <!-- 引入公共脚本：导航、返回顶部、主题等通用功能 -->
  <script src="./assets/js/script.js"></script>
  <!-- 用户菜单：初始化头像下拉菜单、切换显示/隐藏、退出登录 -->
  <script>
    (function initUserMenu() {
      var username = localStorage.getItem('username') || '用户';
      document.getElementById('avatarText').textContent = username.charAt(0).toUpperCase();
      document.getElementById('displayUsername').textContent = username;
    })();
    // 切换用户下拉菜单的显示/隐藏
    function toggleUserDropdown() {
      var d = document.getElementById('userDropdown');
      d.style.display = d.style.display === 'none' ? 'block' : 'none';
    }
    document.addEventListener('click', function(e) {
      var m = document.getElementById('userMenu');
      if (m && !m.contains(e.target)) document.getElementById('userDropdown').style.display = 'none';
    });
    // 退出登录：清除token和username，跳转到登录页
    function doLogout() {
      localStorage.removeItem('token'); localStorage.removeItem('username');
      window.location.href = '../adminkit-web-ui-kit-dashboard-template/static/pages-sign-in.html';
    }
  </script>
<!--
设置页
  localStorage读写:
    深色模式: localStorage.darkMode = "true"|"false"
              → document.documentElement.setAttribute/removeAttribute('data-theme','dark')
    相似电影: localStorage.similarMoviesEnabled = "true"|"false"
  所有开关状态在页面加载时从localStorage恢复
-->
<script>
    (function() {
      var isDark = localStorage.getItem('darkMode') === 'true';
      if (isDark) document.documentElement.setAttribute('data-theme', 'dark');

      var darkToggle = document.getElementById('toggleDarkMode');
      var similarToggle = document.getElementById('toggleSimilarMovies');

      if (darkToggle) {
        darkToggle.checked = isDark;
        darkToggle.addEventListener('change', function() {
          if (this.checked) {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('darkMode', 'true');
          } else {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('darkMode', 'false');
          }
        });
      }

      if (similarToggle) {
        var similarEnabled = localStorage.getItem('similarMoviesEnabled');
        similarToggle.checked = similarEnabled !== 'false';
        similarToggle.addEventListener('change', function() {
          localStorage.setItem('similarMoviesEnabled', this.checked ? 'true' : 'false');
        });
      }

        });
      }
    })();
  </script>
</body>
</html>
