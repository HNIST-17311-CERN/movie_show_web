<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电影详情 - 电影俱乐部 Movie Club</title>
  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    .ratings-card .rating-score {
      font-size: 24px;
      font-weight: bold;
    }
    .ratings-card .rating-platform {
      font-size: 16px;
      font-weight: bold;
    }
    .user-menu { position: relative; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary, #007bff); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; user-select: none; }
    .user-dropdown { position: absolute; top: 44px; right: 0; width: 180px; background: #fff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 1000; overflow: hidden; }
    .user-info { padding: 14px 16px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; text-align: center; }
    .user-dropdown-menu { list-style: none; margin: 0; padding: 4px 0; }
    .user-dropdown-menu li a { display: block; padding: 10px 16px; font-size: 13px; color: #333; text-decoration: none; transition: background 0.2s; }
    .user-dropdown-menu li a:hover { background: #f5f5f5; color: #e74c3c; }
    .upload-res-btn { margin-left: auto; padding: 6px 14px; background: var(--primary, #007bff); color: #fff; border-radius: 6px; font-size: 13px; font-weight: 600; text-decoration: none; transition: background 0.2s; white-space: nowrap; }
    .upload-res-btn:hover { background: var(--primary-hover, #0056b3); }

    .upload-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); z-index: 2000; display: flex; justify-content: center; align-items: center; }
    .upload-modal { background: #fff; border-radius: 12px; width: 420px; max-width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.2); overflow: hidden; }
    .upload-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #e5e7eb; }
    .upload-modal-header h3 { font-size: 16px; margin: 0; }
    .upload-modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: #999; }
    .upload-modal-body { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .upload-modal-body label { font-size: 13px; font-weight: 600; color: #333; }
    .upload-modal-body input, .upload-modal-body select { height: 36px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
    .upload-movie-name { font-size: 13px; color: #666; margin-bottom: 4px; }
    .upload-tip { font-size: 12px; color: #f59e0b; margin: 0; }
    .upload-submit-btn { height: 38px; background: var(--primary, #007bff); color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .upload-submit-btn:hover { background: var(--primary-hover, #0056b3); }
  </style>
</head>
<body id="top">

<header class="header">
  <div class="header-inner">
    <a href="./index.html" class="logo"><span class="logo-cn">电影俱乐部</span> <span class="logo-en">Movie Club</span></a>
    <nav class="nav-links">
      <a href="./index.html">首页</a>
      <a href="./All_movie.html" class="active">电影</a>
      <a href="./TV_series.html">剧集</a>
      <a href="./Net_movie.html">动漫</a>
      <a href="./Online.html">在线</a>
      <a href="#">解析</a>
      <a href="./Setting.html">设置</a>
    </nav>
    <div class="search-box">
      <input type="text" placeholder="搜索影片">
    </div>
    <div class="header-actions">
      <div class="user-menu" id="userMenu">
        <div class="user-avatar" onclick="toggleUserDropdown()">
          <span id="avatarText">用</span>
        </div>
        <div class="user-dropdown" id="userDropdown" style="display:none;">
          <div class="user-info"><b id="displayUsername">--</b></div>
          <ul class="user-dropdown-menu">
            <li><a href="../adminkit-web-ui-kit-dashboard-template/static/pages-blank.html">后台管理</a></li>
            <li><a href="#" onclick="doLogout()">退出登录</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <div class="movie-header">
    <div class="poster-col">
      <img id="movie-poster" src="./assets/images/movie-1.png" alt="电影海报">
    </div>
    <div class="meta-col">
      <h1 id="movie-title" class="movie-title">电影标题</h1>
      <span id="movie-status" class="status-tag"></span>
      <div class="meta-list" id="movie-meta"></div>
    </div>
    <div class="ratings-card">
      <div class="rating-item">
        <div class="rating-platform">豆瓣</div>
        <div class="rating-score" id="douban-score">--</div>
        <div class="rating-count" id="douban-count"></div>
      </div>
      <div class="rating-item">
        <div class="rating-platform">IMDb</div>
        <div class="rating-score" id="imdb-score">--</div>
        <div class="rating-count" id="imdb-count"></div>
      </div>
    </div>
  </div>

  <div class="detail-section">
    <h2 class="section-title">电影简介</h2>
    <p class="intro-text" id="movie-intro">电影简介...</p>
  </div>

  <div class="detail-section">
    <div class="detail-tabs" id="resource-tabs"></div>
    <div class="quality-filters" id="quality-filters">
      <span class="quality-tag active">全部</span>
      <span class="quality-tag">720P</span>
      <span class="quality-tag">1080P</span>
      <span class="quality-tag">4K</span>
      <span class="quality-tag">蓝光</span>
    </div>
    <div class="detail-toolbar">
      <input type="text" placeholder="搜索资源..." id="resource-search">
      <select id="resource-sort"><option>按发布时间排序</option></select>
      <a href="#" class="upload-res-btn" title="上传资源" onclick="openUploadModal();return false;">+ 上传资源</a>
    </div>
    <table class="resource-table">
      <thead>
      <tr>
        <th>名称</th>
        <th>下载</th>
        <th>大小</th>
        <th>做种</th>
        <th>发布时间</th>
      </tr>
      </thead>
      <tbody id="resource-tbody"></tbody>
    </table>
  </div>

  <!-- 相似电影推荐（插件） -->
  <div class="detail-section similar-movies" id="similarMoviesSection">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <h2 class="section-title" style="margin-bottom:0;">相似电影推荐</h2>
      <button id="similarRefreshBtn" class="tab-btn" style="font-size:12px;padding:6px 14px;">换一换</button>
    </div>
    <div class="similar-grid" id="similarMoviesGrid">
      <div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--text-muted);">加载中...</div>
    </div>
  </div>
</div>

<div class="upload-modal-overlay" id="uploadModal" style="display:none;">
  <div class="upload-modal">
    <div class="upload-modal-header">
      <h3>上传资源</h3>
      <button class="upload-modal-close" onclick="closeUploadModal()">✕</button>
    </div>
    <div class="upload-modal-body">
      <p class="upload-movie-name" id="uploadMovieName"></p>
      <label>资源名称</label>
      <input type="text" id="uploadName" placeholder="如：蓝光原盘压制版">
      <label>画质</label>
      <select id="uploadQuality">
        <option value="720P">720P</option>
        <option value="1080P" selected>1080P</option>
        <option value="4K">4K</option>
        <option value="蓝光">蓝光</option>
      </select>
      <label>资源类型</label>
      <select id="uploadType">
        <option value="磁力">磁力</option>
        <option value="网盘">网盘</option>
      </select>
      <label>文件大小</label>
      <input type="text" id="uploadSize" placeholder="如：2.9GB">
      <label>下载地址</label>
      <input type="text" id="uploadUrl" placeholder="磁力链接或网盘链接">
      <label>备注</label>
      <input type="text" id="uploadNote" placeholder="补充说明（可选）">
      <p class="upload-tip">提交后需管理员审核通过才会公开显示</p>
      <button class="upload-submit-btn" onclick="submitResource()">提交审核</button>
    </div>
  </div>
</div>

<a href="#top" class="go-top" data-go-top>↑</a>

<script src="./assets/js/script.js"></script>
<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var movieId = params.get('id');
    var token = localStorage.getItem('token');
    var DEFAULT_COVER_URL = './assets/images/movie-1.png';

    if (!movieId) {
      alert('未传入电影 ID');
      return;
    }

    function normalizeLocalCover(cover) {
      if (!cover) return DEFAULT_COVER_URL;
      if (/^https?:\/\//i.test(cover)) return cover;

      var normalized = String(cover).replace(/\\/g, '/');
      var imageIndex = normalized.indexOf('assets/images/');
      if (imageIndex !== -1) return './' + normalized.substring(imageIndex);
      var resourceIndex = normalized.indexOf('resource/cover/');
      if (resourceIndex !== -1) return './' + normalized.substring(resourceIndex);
      if (normalized.startsWith('./')) return normalized;
      if (normalized.startsWith('/')) return '.' + normalized;
      return normalized;
    }

    function setLocalImage(imgEl, cover) {
      imgEl.src = normalizeLocalCover(cover);
      imgEl.onerror = function() {
        this.onerror = null;
        this.src = DEFAULT_COVER_URL;
      };
    }

    function setText(id, text) {
      var el = document.getElementById(id);
      if (el) el.textContent = text;
    }

    function createMetaItem(label, value) {
      return '<div class="meta-item"><span class="meta-label">' + label + '：</span><span class="meta-value">' + (value || '未知') + '</span></div>';
    }

    function renderMovieDetails(details) {
      setLocalImage(document.getElementById('movie-poster'), details.cover);
      setText('movie-title', (details.name || '未知') + (details.releaseDate ? ' (' + String(details.releaseDate).substring(0, 4) + ')' : ''));
      setText('movie-status', details.status || '');

      var metaHtml = [
        createMetaItem('导演', details.director),
        createMetaItem('编剧', details.screenwriter),
        createMetaItem('主演', details.actors),
        createMetaItem('类型', details.type),
        createMetaItem('地区', details.region),
        createMetaItem('语言', details.language),
        createMetaItem('上映', details.releaseDate),
        createMetaItem('片长', details.duration ? details.duration + '分钟' : '')
      ].join('');
      document.getElementById('movie-meta').innerHTML = metaHtml;
      setText('movie-intro', details.description || '暂无简介');
    }

    function renderScores(scores) {
      if (!scores || !scores.length) return;
      var s = scores[0];
      setText('douban-score', s.score.toFixed(1));
      setText('douban-count', s.count ? s.count + '人评价' : '');
      setText('imdb-score', s.score.toFixed(1));
      setText('imdb-count', s.count ? s.count + '人评价' : '');
    }

    function renderScoresFromApi(scores) {
      if (!Array.isArray(scores) || !scores.length) {
        setText('douban-score', '--'); setText('douban-count', '');
        setText('imdb-score', '--'); setText('imdb-count', '');
        return;
      }

      var s = scores[0];
      var fmt = function(v) { v = Number(v); return Number.isFinite(v) ? v.toFixed(1) : '--'; };
      var cnt = function(v) { v = Number(v); return Number.isFinite(v) && v > 0 ? v + '人评价' : ''; };

      setText('douban-score', fmt(s.score));
      setText('douban-count', cnt(s.count));
      setText('imdb-score', fmt(s.score));
      setText('imdb-count', cnt(s.count));
    }

    function renderResources(resources) {
      var tbody = document.getElementById('resource-tbody');
      var tabsContainer = document.getElementById('resource-tabs');
      if (!resources || !resources.length) {
        tbody.innerHTML = '<tr><td colspan="5">暂无资源</td></tr>';
        tabsContainer.innerHTML = '';
        return;
      }

      var categories = Array.from(new Set(resources.map(function(r) { return r.category || '其他'; })));
      tabsContainer.innerHTML = categories.map(function(c) {
        return '<button class="tab-btn">' + c + ' (' + resources.filter(function(r) { return (r.category || '其他') === c; }).length + ')</button>';
      }).join('');

      function fillRows(list) {
        tbody.innerHTML = list.map(function(r) {
          return '<tr>' +
            '<td><span class="resource-name">' + (r.name || '') + '</span></td>' +
                  '<td>' +
                  (r.url
                          ? '<a class="download-link" href="' + r.url + '" target="_blank">下载</a>'
                          : '无') +
                  '</td>' +
            '<td>' + (r.size || '') + '</td>' +
            '<td>' + (r.seed || '') + '</td>' +
            '<td>' + (r.pubDate || '') + '</td>' +
            '</tr>';
        }).join('');
      }

      fillRows(resources);
      var tabBtns = tabsContainer.querySelectorAll('.tab-btn');
      tabBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          tabBtns.forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          var category = btn.textContent.replace(/\(\d+\)/, '').trim();
          fillRows(resources.filter(function(r) { return (r.category || '其他') === category; }));
        });
      });
    }

    fetch('http://localhost:8080/FILMES/ONEID?id=' + movieId, { headers: { token: token || '' } })
      .then(function(res) { return res.json(); })
      .then(renderMovieDetails)
      .catch(function(err) { console.error('获取电影详情失败', err); });

    fetch('http://localhost:8080/FILMES/SCORE/ONE?id=' + encodeURIComponent(movieId), { headers: { token: token || '' } })
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(renderScoresFromApi)
      .catch(function(err) { console.error('获取评分失败', err); });

    fetch('http://localhost:8080/FILMES/RESOURCE/ONE?id=' + movieId, { headers: { token: token || '' } })
      .then(function(res) { return res.json(); })
      .then(renderResources)
      .catch(function(err) { console.error('获取资源失败', err); });

  })();

</script>

<script>
  (function initUserMenu() {
    var username = localStorage.getItem('username') || '用户';
    document.getElementById('avatarText').textContent = username.charAt(0).toUpperCase();
    document.getElementById('displayUsername').textContent = username;
  })();
  function toggleUserDropdown() {
    var d = document.getElementById('userDropdown');
    d.style.display = d.style.display === 'none' ? 'block' : 'none';
  }
  document.addEventListener('click', function(e) {
    var m = document.getElementById('userMenu');
    if (m && !m.contains(e.target)) document.getElementById('userDropdown').style.display = 'none';
  });
  function doLogout() {
    localStorage.removeItem('token'); localStorage.removeItem('username');
    window.location.href = '../adminkit-web-ui-kit-dashboard-template/static/pages-sign-in.html';
  }

  var currentMovieId = null;
  var currentMovieName = null;

  function openUploadModal() {
    var titleEl = document.getElementById('movie-title');
    currentMovieName = titleEl ? titleEl.textContent.split(' (')[0].trim() : '';
    currentMovieId = new URLSearchParams(window.location.search).get('id');
    document.getElementById('uploadMovieName').textContent = '当前电影：' + (currentMovieName || '--');
    document.getElementById('uploadName').value = '';
    document.getElementById('uploadUrl').value = '';
    document.getElementById('uploadSize').value = '';
    document.getElementById('uploadModal').style.display = 'flex';
  }

  function closeUploadModal() {
    document.getElementById('uploadModal').style.display = 'none';
  }

  document.addEventListener('click', function(e) {
    if (e.target.id === 'uploadModal') closeUploadModal();
  });

  function submitResource() {
    var name = document.getElementById('uploadName').value.trim();
    var url = document.getElementById('uploadUrl').value.trim();
    if (!name || !url) { alert('请填写资源名称和下载地址'); return; }
    var token = localStorage.getItem('token') || '';
    var username = localStorage.getItem('username') || '匿名';

    fetch('http://localhost:8080/SUBMIT/RESOURCE', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', token: token },
      body: JSON.stringify({
        movie_id: parseInt(currentMovieId) || 0,
        movie_name: currentMovieName || '',
        resouce_name: name,
        url: url,
        type: document.getElementById('uploadType').value,
        quality: document.getElementById('uploadQuality').value,
        size: document.getElementById('uploadSize').value.trim(),
        submitter: username,
        note: document.getElementById('uploadNote').value.trim()
      })
    })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.code === 200) {
          alert('提交成功，等待管理员审核');
          closeUploadModal();
        } else {
          alert('提交失败：' + d.msg);
        }
      })
      .catch(function() { alert('请求失败，请检查后端'); });
  }
</script>

<script>
// 相似电影推荐（独立插件 — 不依赖 movieId 参数）
(function() {
  var section = document.getElementById('similarMoviesSection');
  var grid = document.getElementById('similarMoviesGrid');
  if (!section || !grid) return;

  var enabled = localStorage.getItem('similarMoviesEnabled');
  if (enabled === 'false') { section.style.display = 'none'; return; }

  var params = new URLSearchParams(window.location.search);
  var movieId = params.get('id');
  var token = localStorage.getItem('token') || '';
  var DEFAULT_COVER = './assets/images/movie-1.png';

  function renderCards(list) {
    if (!list || !list.length) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--text-muted);">暂无推荐</div>';
      return;
    }
    grid.innerHTML = list.map(function(m) {
      var cover = m.cover || DEFAULT_COVER;
      if (!/^https?:\/\//i.test(cover)) {
        if (cover.indexOf('assets/') === -1 && cover.indexOf('resource/') === -1) cover = DEFAULT_COVER;
        if (!cover.startsWith('./') && !cover.startsWith('/')) cover = './' + cover;
      }
      return '<div class="similar-card" onclick="location.href=\'./movie-details.html?id=' + (m.id || '') + '\'">' +
        '<div class="similar-card-img"><img src="' + cover + '" alt="' + (m.name || '') + '" loading="lazy" onerror="this.src=\'' + DEFAULT_COVER + '\'"></div>' +
        '<div class="similar-card-title" title="' + (m.name || '') + '">' + (m.name || '') + '</div>' +
        '</div>';
    }).join('');
  }

  if (!movieId) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--text-muted);">缺少电影 ID</div>';
    return;
  }

  var PER_PAGE = 7;
  var allMovies = [];
  var page = 0;

  function showPage() {
    var start = page * PER_PAGE;
    var batch = allMovies.slice(start, start + PER_PAGE);
    renderCards(batch);
  }

  function nextPage() {
    if (allMovies.length <= PER_PAGE) return;
    page = (page + 1) % Math.ceil(allMovies.length / PER_PAGE);
    showPage();
  }

  // 第一步：调 Python 获取相似电影 ID 列表
  fetch('http://localhost:8085/movie/similar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ movie_id: parseInt(movieId) })
  })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      var ids = data.similar_ids || [];
      if (!ids.length) { renderCards([]); return; }
      // 第二步：并发调 Java 后端拿所有电影详情
      return Promise.all(ids.map(function(id) {
        return fetch('http://localhost:8080/FILMES/ONEID?id=' + id, { headers: { token: token } })
          .then(function(res) { return res.json(); });
      }));
    })
    .then(function(movies) {
      if (!movies) return;
      allMovies = movies;
      page = 0;
      showPage();
      document.getElementById('similarRefreshBtn').onclick = nextPage;
    })
    .catch(function(err) {
      console.warn('相似电影API未就绪', err);
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--text-muted);">相似电影服务未启动，请先启动 Python 服务 (port 8085)</div>';
    });
})();
</script>
</body>
</html>
