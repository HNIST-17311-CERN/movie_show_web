<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电影俱乐部 Movie Club - 海量电影与剧集</title>
  <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    main .container {
      max-width: 1200px;
      padding: 14px 24px 32px;
    }

    main .section {
      padding: 0 0 40px;
    }

    main .section-header {
      margin-bottom: 16px;
    }

    #home-movies-list {
      margin: 0;
      padding: 0;
      list-style: none;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 24px 20px;
      align-items: start;
    }

    #home-movies-list .movie-card,
    #home-movies-list .movie-card-wrapper {
      width: 100%;
      min-width: 0;
    }

    #home-movies-list .card-banner {
      width: 100%;
      height: 275px;
      overflow: hidden;
    }

    #home-movies-list .card-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #hero-sidebar .hero-side-card.active {
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,123,255,0.15);
    }

    .hero-banner {
      align-items: stretch;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      height: 400px;
      margin-bottom: 26px;
    }

    #hero-featured-link {
      height: 100%;
      min-height: 100%;
      aspect-ratio: auto;
      display: block;
    }

    #hero-sidebar {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: flex-start;
    }

    #hero-sidebar .hero-side-card {
      flex: 0 0 calc((400px - 32px) / 3);
      min-height: 0;
      padding: 10px 12px;
      overflow: hidden;
    }

    #hero-sidebar .hero-side-card img {
      width: 72px;
      height: 102px;
    }
    .user-menu { position: relative; }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--primary, #007bff); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; cursor: pointer; user-select: none;
    }
    .user-dropdown {
      position: absolute; top: 44px; right: 0;
      width: 200px; background: #fff; border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 1000;
      overflow: hidden;
    }
    .user-info {
      padding: 14px 16px; border-bottom: 1px solid #eee;
      font-size: 14px; color: #333; text-align: center;
    }
    .user-dropdown-menu {
      list-style: none; margin: 0; padding: 4px 0;
    }
    .user-dropdown-menu li a {
      display: block; padding: 10px 16px;
      font-size: 13px; color: #333; text-decoration: none;
      transition: background 0.2s;
    }
    .user-dropdown-menu li a:hover {
      background: #f5f5f5; color: #e74c3c;
    }
    .section-shuffle { margin-left: auto; margin-right: 12px; font-size: 13px; color: var(--primary, #2563eb); text-decoration: none; white-space: nowrap; }
    .section-shuffle:hover { text-decoration: underline; }
  </style>
</head>
<body id="top">

  <header class="header">
    <div class="header-inner">
      <a href="./index.html" class="logo"><span class="logo-cn">电影俱乐部</span> <span class="logo-en">Movie Club</span></a>
      <nav class="nav-links">
        <a href="./index.html" class="active">首页</a>
        <a href="./All_movie.html">电影</a>
        <a href="./TV_series.html">剧集</a>
        <a href="./Net_movie.html">动漫</a>
        <a href="./Online.html">在线</a>
        <a href="./JieSuo.html">解析</a>
        <a href="./Setting.html">设置</a>
      </nav>
      <div class="search-box">
        <input type="text" placeholder="搜索影片">
      </div>
      <div class="header-actions">
        <a href="./notifications.html">通知</a>
        <a href="./messages.html">留言</a>
        <a href="#">观看历史</a>
        <div class="user-menu" id="userMenu">
          <div class="user-avatar" onclick="toggleUserDropdown()">
            <span id="avatarText">用</span>
          </div>
          <div class="user-dropdown" id="userDropdown" style="display:none;">
            <div class="user-info">
              <b id="displayUsername">--</b>
            </div>
            <ul class="user-dropdown-menu">
              <li><a href="../adminkit-web-ui-kit-dashboard-template/static/pages-blank.html">后台管理</a></li>
              <li><a href="#" onclick="doLogout()">退出登录</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="hero-banner">
        <a href="./movie-details.html" class="hero-featured" id="hero-featured-link">
          <img id="hero-featured-img" src="./assets/images/movie-1.png" alt="featured movie">
          <div class="hero-featured-overlay">
            <h2 class="hero-featured-title" id="hero-featured-title">推荐影片</h2>
            <p class="hero-featured-subtitle" id="hero-featured-subtitle">Featured movie</p>
            <p class="hero-featured-desc" id="hero-featured-desc">把鼠标移到右侧卡片上可切换推荐内容。</p>
          </div>
        </a>
        <div class="hero-sidebar" id="hero-sidebar"></div>
      </section>

      <section class="section">
        <div class="section-header">
          <h2 class="section-title">最近更新的电影</h2>
          <a href="javascript:void(0)" class="section-shuffle" id="shuffle-movie" style="display:none;">换一换</a>
          <a href="./All_movie.html" class="section-more">更多 &gt;</a>
        </div>
        <div id="home-loading" class="loading-state">加载中...</div>
        <div id="home-error" class="error-state" style="display:none;">加载失败，请检查网络或 token 是否有效</div>
        <ul class="movies-list home-movies" id="home-movies-list"></ul>
      </section>

      <section class="section">
        <div class="section-header">
          <h2 class="section-title">最近更新的剧集</h2>
          <a href="javascript:void(0)" class="section-shuffle" id="shuffle-tv" style="display:none;">换一换</a>
          <a href="./TV_series.html" class="section-more">更多 &gt;</a>
        </div>
        <div id="tv-loading" class="loading-state">加载中...</div>
        <ul class="movies-list home-movies" id="tv-list"></ul>
      </section>

      <section class="section">
        <div class="section-header">
          <h2 class="section-title">最近更新的动漫</h2>
          <a href="javascript:void(0)" class="section-shuffle" id="shuffle-anime" style="display:none;">换一换</a>
          <a href="./Net_movie.html" class="section-more">更多 &gt;</a>
        </div>
        <div id="anime-loading" class="loading-state">加载中...</div>
        <ul class="movies-list home-movies" id="anime-list"></ul>
      </section>
    </div>
  </main>

  <div class="float-widgets">
    <button class="float-widget pink" title="反馈">聊</button>
    <button class="float-widget gray" title="帮助">?</button>
  </div>

  <a href="#top" class="go-top" data-go-top>↑</a>

  <!-- 引入公共脚本：导航、返回顶部、主题等通用功能 -->
  <script src="./assets/js/script.js"></script>

  <!--
    localStorage.token  — JWT令牌（每次请求带在header）
    DOM #home-movies-list / #tv-list / #anime-list — 渲染目标容器
  页面级变量: API_URL, DEFAULT_COVER_URL
-->
  <script>
    (function() {
      var token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '../adminkit-web-ui-kit-dashboard-template/static/pages-sign-in.html';
        return;
      }

      var LOGIN_URL = '../adminkit-web-ui-kit-dashboard-template/static/pages-sign-in.html';
      var DEFAULT_COVER_URL = './assets/images/movie-1.png';

      // 封面URL规范化
      // 入参: cover (String|null) — movie.cover字段，可能是远程URL、"assets/..."相对路径、"resource/cover/..."或null
      // 输出: String — 可直接赋给<img src>的URL，失败时兜底为 DEFAULT_COVER_URL
      function getCoverUrl(cover) {
        if (!cover) return DEFAULT_COVER_URL;
        if (/^https?:\/\//i.test(cover)) return cover;

        var normalized = String(cover).replace(/\\/g, '/');
        if (normalized.indexOf('assets/images/') !== -1) return './' + normalized.substring(normalized.indexOf('assets/images/'));
        if (normalized.indexOf('resource/cover/') !== -1) return './' + normalized.substring(normalized.indexOf('resource/cover/'));
        if (normalized.startsWith('/')) return '.' + normalized;
        return normalized;
      }

      // HTML特殊字符转义（防XSS）
      // 入参: value — 任意用户可控字符串
      // 输出: & < > " ' 替换为HTML实体
      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // 渲染空状态提示
      // 入参: message (String|HTML) — 提示文案，可含<a>标签
      // 写入: DOM #home-movies-list 的 innerHTML
      function renderEmpty(message) {
        document.getElementById('home-movies-list').innerHTML = '<li class="empty-state">' + message + '</li>';
      }

      // Fisher-Yates洗牌，用于Hero随机展示
      // 入参: list (Array<Object>) — 电影对象数组
      // 返回: 新数组（不修改原数组）
      function shuffleMovies(list) {
        var movies = list.slice();
        for (var i = movies.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = movies[i];
          movies[i] = movies[j];
          movies[j] = temp;
        }
        return movies;
      }

      // 拼装Hero副标题元信息
      // 入参: movie.releaseDate(String) / .region / .type
      // 返回: "2024 / 美国 / 科幻" 格式字符串
      function getHeroMeta(movie) {
        return [
          movie.releaseDate ? String(movie.releaseDate).substring(0, 4) : '',
          movie.region || '',
          movie.type || ''
        ].filter(Boolean).join(' / ');
      }

      // 获取Hero推荐描述文本
      // 优先级: movie.description → movie.duration + "min" → "暂无简介"
      function getHeroDesc(movie) {
        return movie.description || (movie.duration ? movie.duration + 'min' : '') || '暂无简介';
      }

      // 更新Hero左侧大图区域
      // 入参: movie { id, name, cover, releaseDate, region, type, description, duration }
      // 写入DOM: #hero-featured-link(href), #hero-featured-img(src/alt), #hero-featured-title, #hero-featured-subtitle, #hero-featured-desc
      function updateHeroFeatured(movie) {
        var featuredLink = document.getElementById('hero-featured-link');
        var featuredImg = document.getElementById('hero-featured-img');
        var featuredTitle = document.getElementById('hero-featured-title');
        var featuredSubtitle = document.getElementById('hero-featured-subtitle');
        var featuredDesc = document.getElementById('hero-featured-desc');

        if (featuredLink) featuredLink.href = './movie-details.html?id=' + encodeURIComponent(movie.id || '');
        if (featuredImg) {
          featuredImg.src = getCoverUrl(movie.cover);
          featuredImg.alt = movie.name || 'featured movie';
          featuredImg.onerror = function() {
            this.onerror = null;
            this.src = DEFAULT_COVER_URL;
          };
        }
        if (featuredTitle) featuredTitle.textContent = movie.name || 'Unknown';
        if (featuredSubtitle) featuredSubtitle.textContent = getHeroMeta(movie) || 'Featured movie';
        if (featuredDesc) featuredDesc.textContent = getHeroDesc(movie);
      }

      // 渲染Hero右侧边栏（3张卡片）
      // 入参: movies (Array) — 从首页电影列表中随机挑选
      // 写入DOM: #hero-sidebar，每张卡片绑定mouseenter事件切换左侧大图
      function renderHero(movies) {
        var heroSidebar = document.getElementById('hero-sidebar');
        if (!heroSidebar || !movies.length) return;

        var picks = shuffleMovies(movies).slice(0, Math.min(3, movies.length));
        heroSidebar.innerHTML = '';
        updateHeroFeatured(picks[0]);

        picks.forEach(function(movie, index) {
          var link = document.createElement('a');
          link.href = './movie-details.html?id=' + encodeURIComponent(movie.id || '');
          link.className = 'hero-side-card' + (index === 0 ? ' active' : '');
          link.innerHTML =
            '<img src="' + escapeHtml(getCoverUrl(movie.cover)) + '" alt="' + escapeHtml(movie.name || 'movie') + '">' +
            '<div class="hero-side-card-info">' +
              '<h3 class="hero-side-card-title">' + escapeHtml(movie.name || 'Unknown') + '</h3>' +
              '<p class="hero-side-card-subtitle">' + escapeHtml(movie.releaseDate ? String(movie.releaseDate).substring(0, 4) : '最新推荐') + '</p>' +
              '<p class="hero-side-card-meta">' + escapeHtml(getHeroMeta(movie) || '--') + '</p>' +
            '</div>';

          var img = link.querySelector('img');
          if (img) {
            img.onerror = function() {
              this.onerror = null;
              this.src = DEFAULT_COVER_URL;
            };
          }

          link.addEventListener('mouseenter', function() {
            heroSidebar.querySelectorAll('.hero-side-card').forEach(function(card) {
              card.classList.remove('active');
            });
            link.classList.add('active');
            updateHeroFeatured(movie);
          });

          heroSidebar.appendChild(link);
        });
      }

      // 渲染单个电影卡片到首页列表
      // 入参: movie { id, name, cover, releaseDate, region, type, duration }
      // 创建: <li> 含封面图、HD角标、标题、年份/地区/类型元信息
      // 异步: GET /FILMES/SCORE/ONE?id= → 回填 .card-score 评分
      // 写入: appendChild到 #home-movies-list
      function renderMovie(movie) {
        var meta = [
          movie.releaseDate ? String(movie.releaseDate).substring(0, 4) : '',
          movie.region || '',
          movie.type || ''
        ].filter(Boolean).join(' / ');

        var li = document.createElement('li');
        li.className = 'movie-card-wrapper';
        li.innerHTML =
          '<div class="movie-card">' +
            '<a href="./movie-details.html?id=' + encodeURIComponent(movie.id || '') + '">' +
              '<figure class="card-banner">' +
                '<img src="' + escapeHtml(getCoverUrl(movie.cover)) + '" alt="' + escapeHtml(movie.name || 'movie') + '">' +
                '<span class="card-badge">HD</span>' +
                '<div class="card-overlay">' +
                  '<span class="star-count">' + escapeHtml(movie.duration ? movie.duration + 'min' : '--') + '</span>' +
                  '<span class="rating">--</span>' +
                '</div>' +
              '</figure>' +
            '</a>' +
            '<h3 class="card-title">' + escapeHtml(movie.name || 'Unknown') + '<span class="card-score"></span></h3>' +
            '<p class="card-meta">' + escapeHtml(meta || '--') + '</p>' +
          '</div>';

        var img = li.querySelector('img');
        if (img) {
          img.onerror = function() {
            this.onerror = null;
            this.src = DEFAULT_COVER_URL;
          };
        }

        document.getElementById('home-movies-list').appendChild(li);

        fetch('http://localhost:8080/FILMES/SCORE/ONE?id=' + encodeURIComponent(movie.id || ''), {
          headers: { token: localStorage.getItem('token') || '' }
        })
          .then(function(res) { return res.json(); })
          .then(function(scores) {
            var score = Array.isArray(scores) && scores.length ? scores[0] : null;
            if (score) {
              var scoreEl = li.querySelector('.card-score');
              if (scoreEl) scoreEl.textContent = Number(score.score).toFixed(1);
            }
          })
          .catch(function() {});
      }

      var PER_BATCH = 12;
      var movieAll = [], tvAll = [], animeAll = [];
      var movieIdx = 0, tvIdx = 0, animeIdx = 0;

      function showBatch(all, idx, listEl, renderFn) {
        var start = idx * PER_BATCH;
        var batch = all.slice(start, start + PER_BATCH);
        listEl.innerHTML = '';
        batch.forEach(renderFn);
      }

      function showMovieBatch() {
        showBatch(movieAll, movieIdx, document.getElementById('home-movies-list'), renderMovie);
        document.getElementById('shuffle-movie').textContent = '换一换';
      }
      function showTvBatch() {
        showBatch(tvAll, tvIdx, document.getElementById('tv-list'), function(item) { renderTvCard(item, document.getElementById('tv-list')); });
        document.getElementById('shuffle-tv').textContent = '换一换';
      }
      function showAnimeBatch() {
        showBatch(animeAll, animeIdx, document.getElementById('anime-list'), function(item) { renderCard(item, document.getElementById('anime-list')); });
        document.getElementById('shuffle-anime').textContent = '换一换';
      }

      // 加载首页电影推荐
      function loadLastMovies() {
        var token = localStorage.getItem('token');
        var loadingEl = document.getElementById('home-loading');
        var errorEl = document.getElementById('home-error');

        if (!token) {
          loadingEl.style.display = 'none';
          renderEmpty('请先 <a href="' + LOGIN_URL + '">登录</a> 后访问');
          return;
        }

        fetch('http://localhost:8080/home/movie?limit=48', {
          headers: { token: token }
        })
          .then(function(res) {
            if (res.status === 401) { localStorage.removeItem('token'); throw new Error('Unauthorized'); }
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function(data) {
            movieAll = Array.isArray(data) ? data : (data && Array.isArray(data.data) ? data.data : []);
            loadingEl.style.display = 'none';
            errorEl.style.display = 'none';
            movieIdx = 0;
            if (!movieAll.length) { renderEmpty('暂无最新电影'); return; }
            showMovieBatch();
            if (movieAll.length > PER_BATCH) document.getElementById('shuffle-movie').style.display = '';
          })
          .catch(function(err) {
            loadingEl.style.display = 'none';
            if (err.message === 'Unauthorized') { renderEmpty('token 已过期，请重新 <a href="' + LOGIN_URL + '">登录</a>'); return; }
            errorEl.style.display = 'block';
          });
      }

      loadHeroBanner();
      loadLastMovies();
      loadAnime();
      loadTv();

    // 加载Hero Banner推荐
    // 步骤1: GET /BIGMOVIE/TOP3 → 返回 [ {id,...}, {id,...}, {id,...} ]
    // 步骤2: GET /FILMES/ALL → 返回全部电影（从中按id匹配补全详情）
    // 步骤3: 调renderHeroSidebar渲染侧边栏
    function loadHeroBanner() {
      var token = localStorage.getItem('token');
      if (!token) return;

      fetch('http://localhost:8080/BIGMOVIE/TOP3', {
        headers: { token: token }
      })
        .then(function(res) { return res.json(); })
        .then(function(heroMovies) {
          if (Array.isArray(heroMovies) && heroMovies.length) {
            updateHeroFeatured(heroMovies[0]);

            var ids = heroMovies.map(function(m) { return m.id; }).join(',');
            fetch('http://localhost:8080/FILMES/ALL', {
              headers: { token: token }
            })
              .then(function(r) { return r.json(); })
              .then(function(allMovies) {
                var sidebarMovies = [];
                if (Array.isArray(allMovies)) {
                  heroMovies.forEach(function(hm) {
                    var found = allMovies.find(function(m) { return m.id === hm.id; });
                    if (found) sidebarMovies.push(found);
                  });
                }
                if (!sidebarMovies.length) sidebarMovies = heroMovies;
                renderHeroSidebar(sidebarMovies, heroMovies);
              })
              .catch(function() { renderHeroSidebar(heroMovies, heroMovies); });
          }
        })
        .catch(function() {});
    }

    // 渲染Hero侧边栏（BIGMOVIE版本）
    // 入参: sidebarMovies — 从/FILMES/ALL匹配到的完整电影数据
    //       heroMovies    — /BIGMOVIE/TOP3返回的原始数据（用于hover时切换大图）
    // 写入DOM: #hero-sidebar，每张卡片mouseenter时调用updateHeroFeatured()
    function renderHeroSidebar(sidebarMovies, heroMovies) {
      var heroSidebar = document.getElementById('hero-sidebar');
      if (!heroSidebar || !sidebarMovies.length) return;

      var picks = sidebarMovies.slice(0, 3);
      heroSidebar.innerHTML = '';

      picks.forEach(function(movie, index) {
        var heroMovie = (heroMovies && heroMovies[index]) ? heroMovies[index] : movie;
        var link = document.createElement('a');
        link.href = './movie-details.html?id=' + encodeURIComponent(movie.id || '');
        link.className = 'hero-side-card' + (index === 0 ? ' active' : '');
        link.innerHTML =
          '<img src="' + escapeHtml(getCoverUrl(movie.cover)) + '" alt="' + escapeHtml(movie.name || 'movie') + '">' +
          '<div class="hero-side-card-info">' +
            '<h3 class="hero-side-card-title">' + escapeHtml(movie.name || 'Unknown') + '</h3>' +
            '<p class="hero-side-card-meta">' + escapeHtml(getHeroMeta(movie) || '--') + '</p>' +
          '</div>';

        var img = link.querySelector('img');
        if (img) {
          img.onerror = function() { this.onerror = null; this.src = DEFAULT_COVER_URL; };
        }

        link.addEventListener('mouseenter', function() {
          heroSidebar.querySelectorAll('.hero-side-card').forEach(function(card) {
            card.classList.remove('active');
          });
          link.classList.add('active');
          updateHeroFeatured(heroMovie);
        });

        heroSidebar.appendChild(link);
      });
    }

    // 加载首页剧集推荐
    function loadTv() {
      var token = localStorage.getItem('token');
      var list = document.getElementById('tv-list');
      var loading = document.getElementById('tv-loading');
      if (!token || !list) return;

      fetch('http://localhost:8080/home/tv?limit=48', {
        headers: { token: token }
      })
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function(data) {
          tvAll = Array.isArray(data) ? data : (data && Array.isArray(data.data) ? data.data : []);
          loading.style.display = 'none';
          tvIdx = 0;
          if (!tvAll.length) { list.innerHTML = '<li class="empty-state">暂无剧集数据</li>'; return; }
          showTvBatch();
          if (tvAll.length > PER_BATCH) document.getElementById('shuffle-tv').style.display = '';
        })
        .catch(function() { loading.style.display = 'none'; });
    }

    // 加载首页动漫推荐
    function loadAnime() {
      var token = localStorage.getItem('token');
      var list = document.getElementById('anime-list');
      var loading = document.getElementById('anime-loading');
      if (!token || !list) return;

      fetch('http://localhost:8080/home/anime?limit=48', {
        headers: { token: token }
      })
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function(data) {
          animeAll = Array.isArray(data) ? data : (data && Array.isArray(data.data) ? data.data : []);
          loading.style.display = 'none';
          animeIdx = 0;
          if (!animeAll.length) { list.innerHTML = '<li class="empty-state">暂无动漫数据</li>'; return; }
          showAnimeBatch();
          if (animeAll.length > PER_BATCH) document.getElementById('shuffle-anime').style.display = '';
        })
        .catch(function() { loading.style.display = 'none'; });
    }

    document.getElementById('shuffle-movie').addEventListener('click', function() {
      movieIdx = (movieIdx + 1) % Math.ceil(movieAll.length / PER_BATCH);
      showMovieBatch();
    });
    document.getElementById('shuffle-tv').addEventListener('click', function() {
      tvIdx = (tvIdx + 1) % Math.ceil(tvAll.length / PER_BATCH);
      showTvBatch();
    });
    document.getElementById('shuffle-anime').addEventListener('click', function() {
      animeIdx = (animeIdx + 1) % Math.ceil(animeAll.length / PER_BATCH);
      showAnimeBatch();
    });

    // 渲染动漫卡片到指定列表
    // 入参: item { id, name, cover, releaseDate, region, type } — 动漫数据
    //       list (DOM Element) — 目标<ul>容器
    // 异步: GET /FILMES/SCORE/ONE?id= → 评分回填
    //       GET /ANIME/EPISODES/ANIME?id= → { totalEpisodes, updateStatus } 回填集数
    function renderCard(item, list) {
      var meta = [
        item.releaseDate ? String(item.releaseDate).substring(0, 4) : '',
        item.region || '',
        item.type || ''
      ].filter(Boolean).join(' / ');

      var li = document.createElement('li');
      li.className = 'movie-card-wrapper';
      li.innerHTML =
        '<div class="movie-card">' +
          '<a href="./movie-details.html?id=' + encodeURIComponent(item.id || '') + '">' +
            '<figure class="card-banner">' +
              '<img src="' + escapeHtml(getCoverUrl(item.cover)) + '" alt="' + escapeHtml(item.name || '') + '">' +
              '<span class="card-badge">HD</span>' +
              '<div class="card-overlay">' +
                '<span class="episode-count">--</span>' +
                '<span class="episode-status">--</span>' +
              '</div>' +
            '</figure>' +
          '</a>' +
          '<h3 class="card-title">' + escapeHtml(item.name || 'Unknown') + '<span class="card-score"></span></h3>' +
          '<p class="card-meta">' + escapeHtml(meta || '--') + '</p>' +
        '</div>';

      var img = li.querySelector('img');
      if (img) {
        img.onerror = function() { this.onerror = null; this.src = DEFAULT_COVER_URL; };
      }

      list.appendChild(li);

      fetch('http://localhost:8080/FILMES/SCORE/ONE?id=' + encodeURIComponent(item.id || ''), {
        headers: { token: localStorage.getItem('token') || '' }
      })
        .then(function(res) { return res.json(); })
        .then(function(scores) {
          var score = Array.isArray(scores) && scores.length ? scores[0] : null;
          if (score) {
            var el = li.querySelector('.card-score');
            if (el) el.textContent = Number(score.score).toFixed(1);
          }
        })
        .catch(function() {});

      fetch('http://localhost:8080/ANIME/EPISODES/ANIME?id=' + encodeURIComponent(item.id || ''), {
        headers: { token: localStorage.getItem('token') || '' }
      })
        .then(function(res) { return res.json(); })
        .then(function(ep) {
          if (ep) {
            var cntEl = li.querySelector('.episode-count');
            var stEl = li.querySelector('.episode-status');
            if (cntEl && ep.totalEpisodes) cntEl.textContent = '全' + ep.totalEpisodes + '集';
            if (stEl && ep.updateStatus) stEl.textContent = ep.updateStatus;
          }
        })
        .catch(function() {});
    }

      var img = li.querySelector('img');
      if (img) {
        img.onerror = function() { this.onerror = null; this.src = DEFAULT_COVER_URL; };
      }

      list.appendChild(li);

      fetch('http://localhost:8080/FILMES/SCORE/ONE?id=' + encodeURIComponent(item.id || ''), {
        headers: { token: localStorage.getItem('token') || '' }
      })
        .then(function(res) { return res.json(); })
        .then(function(scores) {
          var score = Array.isArray(scores) && scores.length ? scores[0] : null;
          if (score) {
            var el = li.querySelector('.card-score');
            if (el) el.textContent = Number(score.score).toFixed(1);
          }
        })
        .catch(function() {});

      fetch('http://localhost:8080/TV/EPISODES/TV?id=' + encodeURIComponent(item.id || ''), {
        headers: { token: localStorage.getItem('token') || '' }
      })
        .then(function(res) { return res.json(); })
        .then(function(ep) {
          if (ep) {
            var cntEl = li.querySelector('.episode-count');
            var stEl = li.querySelector('.episode-status');
            if (cntEl && ep.totalEpisodes) cntEl.textContent = '全' + ep.totalEpisodes + '集';
            if (stEl && ep.updateStatus) stEl.textContent = ep.updateStatus;
          }
        })
        .catch(function() {});

    })();

  <!--
用户菜单组件（所有页面复用）
  读取: localStorage.username → 首字母显示在头像、全名显示在下拉框
  操作: toggleUserDropdown() 切换显示, doLogout() 清除 localStorage.token 和 username 后跳转登录页
--><script>
    (function initUserMenu() {
      var username = localStorage.getItem('username') || '用户';
      document.getElementById('avatarText').textContent = username.charAt(0).toUpperCase();
      document.getElementById('displayUsername').textContent = username;
    })();

    // 切换用户下拉菜单显示/隐藏
    // 读取DOM: #userDropdown.style.display，在 'none' 和 'block' 间切换
    function toggleUserDropdown() {
      var dropdown = document.getElementById('userDropdown');
      dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
    }

    document.addEventListener('click', function(e) {
      var menu = document.getElementById('userMenu');
      if (menu && !menu.contains(e.target)) {
        document.getElementById('userDropdown').style.display = 'none';
      }
    });

    // 退出登录
    // 清除: localStorage.removeItem('token'), localStorage.removeItem('username')
    // 跳转: window.location.href → adminkit/.../pages-sign-in.html
    function doLogout() {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      window.location.href = '../adminkit-web-ui-kit-dashboard-template/static/pages-sign-in.html';
    }
  </script>
