# Ubuntu Nginx site config — 放到 /etc/nginx/sites-available/security.conf
# 使用前：把 server_name 改成你的域名或公网 IP
server {
    listen 80;
    listen [::]:80;
    server_name ciaohell.icu;

    client_max_body_size 50m;

    # 运行时替换硬编码 localhost 端口 → 同源
    sub_filter_once off;
    sub_filter_types text/javascript application/javascript text/css;
    sub_filter 'http://localhost:8080' '';
    sub_filter 'http://localhost:8085' '';

    # Python 图识服务
    location /movie/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # ========== API 反向代理到 Spring Boot ==========
    location /FILMES/  { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/     { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /ANIME/   { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /TV/      { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /PLAY/    { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_buffering off; }
    location /BIGMOVIE/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /home/    { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /role/    { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /Mapper/  { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /JDBC/    { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /SUBMIT/  { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /AUDIT/   { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    # 前端 /filmlane-master/ 前缀兼容
    location /filmlane-master/ {
        rewrite ^/filmlane-master/(.*)$ /$1 last;
    }

    # Live2D 资源
    location /live2d-example-master/ {
        alias /opt/security/static/live2d-example-master/;
    }

    # 主站前端
    location / {
        root /opt/security/static/filmlane-master;
        index index.html;
    }

    # 管理后台
    location /admin/ {
        alias /opt/security/static/adminkit-web-ui-kit-dashboard-template/static/;
        index index.html;
    }

    location /adminkit-web-ui-kit-dashboard-template/ {
        alias /opt/security/static/adminkit-web-ui-kit-dashboard-template/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root html; }
}
